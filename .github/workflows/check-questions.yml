name: Check question bank

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-check-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run typecheck
      - run: npm run verify
      - run: npm test
      - name: Classroom integration tests
        run: npx tsx scripts/test-classroom.ts
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /codewarrior
          NEXT_TELEMETRY_DISABLED: 1
      - name: Install browser for visual and interaction checks
        run: npx playwright install --with-deps chromium
      - name: Check Chromebook journeys
        run: npm run test:quality
      - name: Save browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-quality-screenshots
          path: artifacts/quality/
          retention-days: 7
