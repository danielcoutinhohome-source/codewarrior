name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check every question against real Java
        run: npm run verify
      - name: Game, Learn Mode, tutor server and sound tests
        run: npm test
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /codewarrior
          NEXT_TELEMETRY_DISABLED: 1
          # Public URL of the tutor server (a repository variable, not a secret). Empty = tutor offline.
          NEXT_PUBLIC_TUTOR_URL: ${{ vars.TUTOR_URL }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
