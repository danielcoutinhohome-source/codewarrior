name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Check every question against real Java
        run: npm run verify
      - name: Game, Learn Mode, tutor server and sound tests
        run: npm test
      # Free AI tutor: deploys tutor-server/ to Cloudflare Workers AI (free plan, no AI key, no bill)
      # when the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets exist. Without them, or if
      # this step fails, the site still deploys and the tutor shows as offline.
      - name: Check for Cloudflare secrets
        id: cf
        run: echo "ready=${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}" >> "$GITHUB_OUTPUT"
      - name: Deploy the free tutor server
        id: tutor
        if: steps.cf.outputs.ready == 'true'
        continue-on-error: true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: tutor-server
        run: |
          npx --yes wrangler@4 deploy 2>&1 | tee deploy.log
          url=$(grep -oE 'https://[A-Za-z0-9.-]+\.workers\.dev' deploy.log | head -1)
          test -n "$url" || { echo "::error::No workers.dev URL in the deploy output. Open Workers & Pages in the Cloudflare dashboard once to pick a workers.dev subdomain."; exit 1; }
          sleep 5
          curl -fsS "$url/v1/health"; echo
          echo "url=$url" >> "$GITHUB_OUTPUT"
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /codewarrior
          NEXT_TELEMETRY_DISABLED: 1
          # Public URL of the tutor server: the one just deployed, else the TUTOR_URL repository
          # variable. Empty = tutor offline.
          NEXT_PUBLIC_TUTOR_URL: ${{ steps.tutor.outputs.url || vars.TUTOR_URL }}
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
