name = "codewarrior-tutor"
main = "src/worker.ts"
compatibility_date = "2026-06-01"

# Free AI: Cloudflare Workers AI. No API key. The Workers Free plan includes a daily
# allowance; past it, requests fail (the site says "used up, resets tomorrow"). Nothing is billed.
[ai]
binding = "AI"

[vars]
TUTOR_PROVIDER = "workers-ai"
TUTOR_MODEL = "@cf/meta/llama-3.1-8b-instruct-fp8"
ALLOWED_ORIGINS = "https://danielcoutinhohome-source.github.io"
RATE_PER_10MIN = "20"
RATE_PER_DAY = "60"
DAILY_LIMIT = "400"
TIMEOUT_MS = "30000"
